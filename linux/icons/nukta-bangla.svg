<?xml version="1.0" encoding="UTF-8"?>
<!-- Panel icon: নু on a filled tile, so it stays readable on light and dark panels.
     GNOME shows the <symbol> from nukta-bangla.xml instead where it prefers text. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#1f6f54"/>
  <text x="24" y="34" text-anchor="middle" fill="#ffffff"
        font-family="Noto Sans Bengali, Lohit Bengali, Mukti, FreeSans, sans-serif"
        font-size="30">নু</text>
</svg>
