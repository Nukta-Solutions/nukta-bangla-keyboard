[package]
name = "nukta-bangla-windows"
version = "1.0.1"
edition = "2021"
license = "MIT"
publish = false
description = "নুকতা বাংলা: the Bijoy layout and Avro-style phonetic typing as a Windows input method (TSF)"

[lib]
name = "nukta_bangla"
# cdylib: the TSF text service Windows loads into every app (nukta_bangla.dll). rlib: the settings
# program and the tests.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "NuktaBanglaSettings"
path = "src/bin/settings.rs"

[dependencies]
# OpenBangla's phonetic engine (vendored, patched: see riti-bridge/Cargo.toml) and the keycode
# lookup the macOS and Linux builds share.
riti = { path = "../riti-bridge/riti" }
nukta-riti = { path = "../riti-bridge" }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[profile.release]
codegen-units = 1
lto = true
# A panic inside an app's process must stay catchable: the TSF layer catches them so a riti
# failure never takes the app down with it.
panic = "unwind"
