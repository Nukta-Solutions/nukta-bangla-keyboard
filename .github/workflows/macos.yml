# Compiles and tests the macOS input method whenever its code changes on main, without signing
# anything. The Swift code is written on Windows, where it can't be compiled: this catches a broken
# build before the Mac release (scripts/release-mac.sh on the Mac mini) does.
name: macOS

on:
  # Only main: a direct push or a merged pull request. Other branches never run it.
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Package.swift", "riti-bridge/**", "Resources/**", "scripts/build*.sh", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: riti
        run: scripts/build_riti.sh

      - name: Build
        run: swift build -c release --product NuktaBangla

      - name: Test
        run: swift test
