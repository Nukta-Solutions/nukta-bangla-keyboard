# Builds, signs, notarizes and publishes a release when a v* tag is pushed, then points the
# Homebrew cask at it. The secrets it needs are listed in README.md (Releasing).
#
#   1. prepare  the tag must match Info.plist, the Linux engine and windows/Cargo.toml; creates a draft
#   2. macos    scripts/package.sh exactly as on a Mac: Developer ID signed, notarized, stapled.
#               Skipped while the Apple secrets aren't set: then scripts/release-mac.sh, run on a Mac
#               with the certificates, adds the .dmg and publishes the draft.
#   3. linux    riti, tests, linux/package.sh
#   4. windows  windows/build.ps1: tests, both DLLs, the Inno Setup installer
#   5. publish  only once all three assets are up: publish the release, update the tap's cask;
#               otherwise the release stays a draft
#
# The asset names never change: the website links to releases/latest/download/NuktaBangla.dmg,
# NuktaBangla-Setup.exe and nukta-bangla-linux.sh.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sign_mac: ${{ steps.version.outputs.sign_mac }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        id: version
        env:
          SIGN_MAC: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 != '' }}
        run: |
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')
          LINUX=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' linux/nukta_bangla/__init__.py)
          WINDOWS=$(sed -n 's/^version = "\(.*\)"/\1/p' windows/Cargo.toml | head -1)
          echo "tag $TAG, Info.plist $VERSION, Linux engine $LINUX, Windows $WINDOWS"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match CFBundleShortVersionString $VERSION in Resources/Info.plist"
            exit 1
          fi
          if [ "$LINUX" != "$VERSION" ]; then
            echo "::error::linux/nukta_bangla/__init__.py says $LINUX, Info.plist says $VERSION: bump both"
            exit 1
          fi
          if [ "$WINDOWS" != "$VERSION" ]; then
            echo "::error::windows/Cargo.toml says $WINDOWS, Info.plist says $VERSION: bump both"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sign_mac=$SIGN_MAC" >> "$GITHUB_OUTPUT"
          if [ "$SIGN_MAC" != true ]; then
            echo "::notice::No Apple signing secrets: the macOS job is skipped. Run scripts/release-mac.sh $TAG on a Mac to add NuktaBangla.dmg and publish."
          fi

      # A draft, so nothing is public until all three assets are attached. A release made by
      # hand beforehand (with notes) is used as it is.
      - name: Create the draft release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists: uploading to it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "নুকতা বাংলা ${{ steps.version.outputs.version }}" --generate-notes
          fi

  macos:
    needs: prepare
    if: needs.prepare.outputs.sign_mac == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Everything package.sh expects on a Mac: both Developer ID identities in a keychain on the
      # search list, and a notarytool profile named "nukta" in the default keychain.
      - name: Set up signing and notarization
        env:
          APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          API_KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          for name in APPLICATION_P12 APPLICATION_P12_PASSWORD INSTALLER_P12 INSTALLER_P12_PASSWORD \
                      API_KEY_P8 API_KEY_ID API_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::Secret for $name is not set (see README.md, Releasing)"; exit 1; }
          done

          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          umask 077
          for which in APPLICATION INSTALLER; do
            p12_var="${which}_P12"; password_var="${which}_P12_PASSWORD"
            printf '%s' "${!p12_var}" | base64 --decode > "$RUNNER_TEMP/$which.p12"
            security import "$RUNNER_TEMP/$which.p12" -k "$KEYCHAIN" -f pkcs12 -P "${!password_var}" \
              -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/security
            rm -f "$RUNNER_TEMP/$which.p12"
          done
          # The intermediates the certificates chain to, in case the runner image lacks them.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" || true
          done
          # Lets codesign and pkgbuild use the keys without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046 # the existing list, one keychain per word
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"

          IDENTITIES=$(security find-identity -v "$KEYCHAIN")
          echo "$IDENTITIES"
          for identity in "Developer ID Application" "Developer ID Installer"; do
            grep -q "$identity" <<< "$IDENTITIES" \
              || { echo "::error::No valid $identity identity after import (wrong .p12, or missing private key?)"; exit 1; }
          done

          printf '%s\n' "$API_KEY_P8" > "$API_KEY_PATH"
          xcrun notarytool store-credentials nukta --key "$API_KEY_PATH" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --keychain "$KEYCHAIN"

      # No options: package.sh notarizes by default, and fails if signing, notarizing or stapling
      # does. Never --no-notarize here.
      - name: Build, sign, notarize and staple
        run: scripts/package.sh

      - name: Check the DMG before uploading it
        run: |
          DMG="build/NuktaBangla-$VERSION.dmg"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          MOUNT=$(hdiutil attach -nobrowse -readonly "$DMG" | awk -F'\t' '/\/Volumes\// {print $NF}')
          trap 'hdiutil detach "$MOUNT" -quiet' EXIT
          spctl --assess --type install --verbose=2 "$MOUNT/Install Nukta Bangla.pkg"
          xcrun stapler validate "$MOUNT/Install Nukta Bangla.pkg"

      - name: Upload NuktaBangla.dmg
        run: |
          cp "build/NuktaBangla-$VERSION.dmg" "$RUNNER_TEMP/NuktaBangla.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/NuktaBangla.dmg" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove the signing keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true
          security default-keychain -d user -s login.keychain-db 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-api-key.p8" "$RUNNER_TEMP"/*.p12

  linux:
    needs: prepare
    # The oldest supported image on purpose: libnukta_riti.so only loads on systems with at least
    # the glibc it was built against (22.04 has 2.35, so Debian 12 and Ubuntu 22.04 work).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # riti first, or the phonetic tests skip themselves.
      - name: Build riti
        run: linux/build_riti.sh

      - name: Test
        run: python3 -m unittest discover -s linux/tests

      - name: Package
        run: linux/package.sh

      - name: Upload nukta-bangla-linux.sh
        run: |
          cp "build/nukta-bangla-$VERSION-linux.sh" "$RUNNER_TEMP/nukta-bangla-linux.sh"
          gh release upload "$TAG" "$RUNNER_TEMP/nukta-bangla-linux.sh" --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, test and package
        shell: pwsh
        run: |
          # dumpbin, for build.ps1's check of the DLL's exports.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name | Select-Object -Last 1
          $env:PATH = "$($tools.FullName)\bin\Hostx64\x64;$env:PATH"
          ./windows/build.ps1

      - name: Upload NuktaBangla-Setup.exe
        shell: bash
        run: gh release upload "$TAG" build/windows/NuktaBangla-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [prepare, macos, linux, windows]
    # Runs when macos was skipped too; the asset check below decides whether to publish.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.linux.result == 'success' &&
      needs.windows.result == 'success' && needs.macos.result != 'failure'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      # releases/latest/download/<name> breaks for any platform whose file is missing.
      - name: Check all three assets are attached
        id: assets
        run: |
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$ASSETS"
          for name in NuktaBangla.dmg NuktaBangla-Setup.exe nukta-bangla-linux.sh; do
            if ! grep -qx "$name" <<< "$ASSETS"; then
              echo "::warning::$name is not attached to $TAG yet: the release stays a draft. For the .dmg, run scripts/release-mac.sh $TAG on a Mac."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.assets.outputs.ready == 'true'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Hash what users will actually download, from the public URL the cask uses.
      - name: Hash the published DMG
        if: steps.assets.outputs.ready == 'true' && env.HAS_TAP_TOKEN == 'true'
        id: dmg
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/NuktaBangla.dmg"
          curl -fsSL --retry 5 --retry-all-errors -o NuktaBangla.dmg "$URL"
          echo "sha256=$(sha256sum NuktaBangla.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.assets.outputs.ready == 'true' && env.HAS_TAP_TOKEN == 'true'
        with:
          repository: Nukta-Solutions/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the cask
        if: steps.assets.outputs.ready == 'true' && env.HAS_TAP_TOKEN == 'true'
        working-directory: tap
        env:
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          CASK=Casks/nukta-bangla.rb
          sed -i -E "s/^(  version )\"[^\"]*\"/\1\"$VERSION\"/; s/^(  sha256 )\"[^\"]*\"/\1\"$SHA256\"/" "$CASK"
          if ! grep -q "^  version \"$VERSION\"$" "$CASK" || ! grep -q "^  sha256 \"$SHA256\"$" "$CASK"; then
            echo "::error::Could not update version/sha256 in $CASK"
            exit 1
          fi
          git diff
          if git diff --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "nukta-bangla $VERSION"
          git push
